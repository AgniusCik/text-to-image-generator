<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Text to Flower Image Generator</title>
        <link rel="stylesheet" href="styles.css">
        <script src="input.js" defer></script>
    </head>

    <body>
        <div class="head">
            <h1>Describe a flower</h1>
        </div>

        <div class="promptform">
            <form id="form">
                <label for="prompt">Prompt here</label><br>
                <input type="text" id="prompt" name="prompt" maxlength="100">
                <button type="submit" id="submit-btn">Generate</button>
            </form>
            <p id="status"></p>
            <img id="result-image" alt="Generated flower" />
        </div>
    </body>
</html>
